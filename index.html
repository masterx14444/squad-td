#home .sub{text-align:center;color:var(--muted);font-size:15px;margin:0 0 8px}
.hbtn{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;color:var(--fg);font:inherit;cursor:pointer;min-height:56px}
.hbtn b{font-size:18px}.hbtn small{color:var(--muted);font-size:13px}
.hbtn.main{border-color:var(--gold);background:linear-gradient(180deg,rgba(233,185,73,.16),var(--panel))}
.hbtn:disabled{opacity:.5;cursor:default}
.hbtn:not(:disabled):hover{border-color:var(--gold)}
#home .hv h2{margin:0 0 6px;font-family:var(--font-display);font-size:22px}
#home .hv ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.5}

#home .back{align-self:flex-start;margin-bottom:6px}
#home .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
#home .sg div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
#home .sg b{display:block;font-size:22px;color:var(--gold)}#home .sg small{color:var(--muted);font-size:12px}
#pick{display:flex;flex-direction:column;gap:8px}
#pick h2{margin:4px 0 0;font-family:var(--font-display);font-size:22px;text-wrap:balance}
#pick p{margin:0;color:var(--muted);font-size:15px}
.fac{text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fac b{font-family:var(--font-display);font-size:18px}
.fac .s{color:var(--muted);font-size:14px}
.fac .p{font-size:14px;color:var(--gold)}
.fac ul{margin:2px 0 0;padding-left:18px;font-size:14px;line-height:1.35}
.fb{display:flex;flex-direction:column;gap:8px}
.fb h3{margin:0;font-family:var(--font-display);font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1;min-width:44px;min-height:40px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--panel-2)}
.fb textarea{width:100%;min-height:84px;background:var(--panel);color:var(--fg);border:1.5px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:16px;resize:vertical}

details.how{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;line-height:1.4}

 {const wk=CUR_ORDER[g.wave-1];if(g.cardsOn&&(wk==='boss'||wk==='bossplit'||wk==='urboss')){

function aiBuy0(g,l,opt){

 if(false&&g.wave>=3&&lane.wspd<Math.min(3,Math.floor(g.wave/3))){const wc=wspdCost(lane);if(wc<=budget*0.5&&buyWSpeed(g,l)===true)budget-=wc;}
 for(let guard=0;guard<80;guard++){
  if(pu(lane).length>=4&&(pu(lane).length>=12||Math.random()<(pu(lane).length>=6?0.72:0.45))){
   const cand=pu(lane).filter(u=>u.lvl<CFG.MAX_LVL&&upCost(u)<=budget&&upCost(u)<=lane.gold);
   if(cand.length){
    const lo=Math.min(...cand.map(u=>u.lvl)),pool=cand.filter(u=>u.lvl===lo),u=pool[Math.floor(Math.random()*pool.length)],cost=upCost(u);
    if(upgrade(g,l,u.cx,u.cy,Math.random()<0.5?'a':'b')===true){budget-=cost;continue;}
   }
   if(pu(lane).length>=12)break;
  }
  let t=AI_PATTERN[pu(lane).length%AI_PATTERN.length];if(!FACTIONS[lane.fac].units[t])t=t==='spec'?'fighter':'archer';
  if((t==='fighter'||t==='archer')&&Math.random()<0.7){const wi=waveInfo(g.wave+1);if(wi){const ar=KINDS[wi.kind].ar,U=FACTIONS[lane.fac].units,mf=tmult(U.fighter.at,ar),ma=tmult(U.archer.at,ar);if(mf>ma)t='fighter';else if(ma>mf)t='archer';}}
  {const wi2=waveInfo(g.wave+1);if(wi2&&(KINDS[wi2.kind].air||(wi2.mix||[]).some(m=>KINDS[m.kind].air))&&Math.random()<0.6){t=Math.random()<0.65?'archer':'mage';if(!FACTIONS[lane.fac].units[t])t='archer';}}
  const c=FACTIONS[lane.fac].units[t].cost;
  if(c>budget||c>lane.gold)break;
  if(!aiPlace(g,l,t))break;budget-=c;
 }
 if((SURPLUS||lane.rich)&&g.diff!=='easy'&&g.wave>=5&&pu(lane).length>=8){for(let i=0;i<2;i++){if(lane.mines.gold<5){const mc=mineCost(lane,'gold');if(mc<=budget*0.7&&buyMine(g,l,'gold')===true){budget-=mc;continue;}}if(lane.mines.myth<4&&g.wave>=7){const mc=mineCost(lane,'myth');if(mc<=budget*0.7&&buyMine(g,l,'myth')===true){budget-=mc;continue;}}break;}}
 if(opt.mercs!==false&&g.wave>=(g.diff==='easy'?4:g.diff==='hard'?2:3)){
  for(let guard=0;guard<20;guard++){
   let t=null;
   const sv=g.diff==='easy'?0.88:g.diff==='hard'?0.3:g.wave<8?0.4:0.3,save=g.wave>=4&&lane.myth>=30&&lane.myth<100&&Math.random()<sv;
   if(save)break;
   const pool=Object.keys(MERCS).filter(k=>k!=='herald'&&MERCS[k].cost<=lane.myth&&!(MERCS[k].cost>=60&&g.wave<6));
   if(lane.myth>=100&&g.wave>=6)t='herald';else if(pool.length&&(lane.myth>=(g.diff==='hard'?15:20)||Math.random()<0.7)){

    else t=pool[Math.floor(Math.random()*pool.length)];}
   if(!t||!sendMerc(g,l,t))break;
  }
 }
}

const Snd=(function(){
  let ctx=null,master,mg,sg,timer=0,step=0,next=0,mode='off',nbuf=null,last={};
  let cfg={};try{cfg=JSON.parse(localStorage.getItem('squadtd-audio')||'{}')||{};}catch(e){}
  const on={music:cfg.music!==false,sfx:cfg.sfx!==false};
  function save(){try{localStorage.setItem('squadtd-audio',JSON.stringify(on));}catch(e){}}
  function apply(){if(!ctx)return;mg.gain.value=on.music?0.32:0;sg.gain.value=on.sfx?0.8:0;}
  function init(){
    if(ctx)return;
    try{
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      ctx=new C();master=ctx.createGain();master.gain.value=0.45;{const cp=ctx.createDynamicsCompressor();cp.threshold.value=-18;cp.knee.value=12;cp.ratio.value=6;cp.attack.value=0.003;cp.release.value=0.15;master.connect(cp);cp.connect(ctx.destination);}
      mg=ctx.createGain();sg=ctx.createGain();mg.connect(master);sg.connect(master);apply();
      nbuf=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      timer=setInterval(pump,40);
    }catch(e){ctx=null;}
  }
  function resume(){init();if(ctx&&ctx.state==='suspended')ctx.resume();}
  let voices=0;
  function vo(s){voices++;s.onended=()=>{voices--;};}
  function tone(f,d,type,v,t,f2,dest){
    if(!ctx||voices>28)return;t=t||ctx.currentTime;
    const o=ctx.createOscillator(),gn=ctx.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
    gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v||0.1,t+Math.min(0.012,d/3));gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(gn);gn.connect(dest||sg);vo(o);o.start(t);o.stop(t+d+0.06);
  }
  function noise(d,v,fq,t,dest){
    if(!ctx||voices>28)return;t=t||ctx.currentTime;
    const s=ctx.createBufferSource();s.buffer=nbuf;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||2000;

    s.connect(f);f.connect(gn);gn.connect(dest||sg);vo(s);s.start(t,Math.random()*0.3);s.stop(t+d+0.03);
  }
  const SFX={
    click(){tone(660,0.05,'square',0.06);},
    tick(){tone(988,0.09,'square',0.1);tone(494,0.12,'triangle',0.1);},
    place(){tone(300,0.09,'triangle',0.16,0,520);},
    buy(){tone(880,0.07,'square',0.07);tone(1320,0.1,'square',0.07,ctx.currentTime+0.07);},
    coin(){tone(1200,0.06,'square',0.06);tone(1600,0.12,'square',0.06,ctx.currentTime+0.06);},
    up(){[523,659,784,1047].forEach((f,i)=>tone(f,0.1,'triangle',0.12,ctx.currentTime+i*0.06));},
    err(){tone(160,0.14,'sawtooth',0.07,0,110);},
    send(){noise(0.25,0.12,900);tone(220,0.2,'sawtooth',0.05,0,520);},
    pop(){tone(520+Math.random()*180,0.07,'triangle',0.05,0,180);},
    hit(){noise(0.05,0.035,1800);tone(150+Math.random()*50,0.07,'triangle',0.05,0,80);},
    thud(){tone(110,0.22,'sine',0.3,0,40);noise(0.1,0.08,300);},
    wave(){[330,392,494].forEach((f,i)=>tone(f,0.16,'square',0.08,ctx.currentTime+i*0.11));},
    boss(){tone(65,0.9,'sawtooth',0.14,0,48);tone(98,0.9,'sawtooth',0.09,0,70);noise(0.5,0.1,200);},
    waveWin(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.14,'triangle',0.13,ctx.currentTime+i*0.07));},
    victory(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,0.2,'square',0.09,ctx.currentTime+i*0.13));},
    heal(){tone(784,0.12,'sine',0.05);tone(1047,0.16,'sine',0.04,ctx.currentTime+0.06);},
    crit(){noise(0.08,0.07,2600);tone(240,0.12,'sawtooth',0.07,0,90);tone(1400,0.08,'square',0.04,ctx.currentTime+0.02);},
    ding(){tone(1318,0.5,'sine',0.14);tone(1976,0.7,'sine',0.09,ctx.currentTime+0.09);tone(2637,0.8,'sine',0.05,ctx.currentTime+0.18);},
    card(){tone(880,0.12,'triangle',0.1);tone(1175,0.18,'triangle',0.1,ctx.currentTime+0.08);},
    level(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,0.28,'triangle',0.12,ctx.currentTime+i*0.09));tone(2093,0.9,'sine',0.08,ctx.currentTime+0.55);},
    wind(){noise(0.9,0.09,700);tone(180,0.8,'sine',0.04,0,260);},
    rain(){noise(0.9,0.07,3200);},
    zap(){tone(220,0.5,'sawtooth',0.13,0,1200);noise(0.4,0.1,1500);tone(880,0.6,'sine',0.08,ctx.currentTime+0.1);},
    defeat(){[392,349,311,262].forEach((f,i)=>tone(f,0.3,'sawtooth',0.09,ctx.currentTime+i*0.2));}

  }
  function setMode(m){if(m===mode)return;mode=m;step=0;if(ctx)next=ctx.currentTime+0.06;}
  function toggle(k){on[k]=!on[k];save();apply();return on[k];}
  return{resume,sfx,setMode,toggle,on};
})();

function buildModals(){
  $('sb').addEventListener('click',()=>{sbMin=!sbMin;try{localStorage.setItem('squadtd-sb',sbMin?'1':'0');}catch(_){}sigH.sb='';renderSb();fit();});
  const t=$('stabs');t.innerHTML='';
  TABS.forEach(([k,l])=>{const b=document.createElement('button');b.className='chip';b.id='st-'+k;b.textContent=l;b.setAttribute('aria-pressed',String(k===scoreTab));b.addEventListener('click',()=>{scoreTab=k;sigH.scorebody='';renderScore();});t.appendChild(b);});
  $('scorex').addEventListener('click',closeModals);$('menux').addEventListener('click',closeModals);
  ['score','menu'].forEach(id=>$(id).addEventListener('pointerdown',ev=>{if(ev.target===$(id))closeModals();}));
  $('btn-score').addEventListener('click',()=>{scoreTab='game';sigH.scorebody='';openModal('score');});
  $('roundbtn').addEventListener('click',()=>{scoreTab='waves';sigH.scorebody='';openModal('score');});
  $('btn-menu').addEventListener('click',()=>openModal('menu'));
  const tg=()=>{$('tmusic').textContent='Musik: '+(Snd.on.music?'an':'aus');$('tsfx').textContent='Effekte: '+(Snd.on.sfx?'an':'aus');};
  $('tmusic').addEventListener('click',()=>{Snd.toggle('music');tg();});$('tsfx').addEventListener('click',()=>{Snd.toggle('sfx');tg();Snd.sfx('coin');});tg();
  document.addEventListener('pointerdown',()=>Snd.resume());
  const tr=$('track');tr.innerHTML='';for(let w=1;w<=CFG.WAVES;w++){const s=document.createElement('i');s.className='pip';s.id='pip'+w;tr.appendChild(s);}
  const hw=$('pick').querySelector('details.how');if(hw)$('menuhow').innerHTML=hw.innerHTML;
  document.addEventListener('keydown',ev=>{
    if(ev.target&&/^(TEXTAREA|INPUT)$/.test(ev.target.tagName))return;
    if($('play').hidden||ev.ctrlKey||ev.metaKey||ev.altKey)return;
    if(ev.key==='Escape'){pendUp=null;if(modal)closeModals();else{sel=null;page='build';openPanel=null;inspect=null;ui();}return;}
    if(modal)return;
    if(ev.key===' '){ev.preventDefault();goFight();return;}
    const i=HOT.toLowerCase().indexOf(ev.key.toLowerCase());
    if(ev.key.length===1&&i>=0){ev.preventDefault();press(i);}
  });
}

 ['2.032 · Mehr Karten',['8 neue Boss-Karten: Berserker, Glasklinge, Bollwerk, Heilsegen (Risiko-Segen mit Vor- und Nachteil), Beutezug, Königs-Genesung, Panzerplatten und Schwarzmarkt','Insgesamt 17 Karten, immer nur nach einem besiegten Boss','Karten zeigen Plus und Minus der Segen in der Einkommenszeile']],
 ['2.031 · Boss-Belohnungen',['Nach jedem besiegten Boss (Welle 5, 10, 15) erscheinen 3 Karten, du hast 15 Sekunden zum Wählen, der Bau-Timer wartet solange','Besiegt heißt: kein Boss kommt bis zum König durch','Karten: Kampfrausch, Eisenhaut, Schnellfeuer, Kriegssegen (je 5 Wellen), Goldregen, Holzlieferung, Königssegen, Handelsvertrag (+4 Einkommen) und Meisterschmiede (dauerhaft +5% Schaden)','Die KI zieht ebenfalls eine zufällige Karte, wenn ihr Boss nicht durchkam']],
 ['2.030 · Bosse im Gleichgewicht',['Alle 15 Wellen mit KI-Spielern durchgemessen: die Boss-Wellen 10 und 15 waren die Spitzen','Bosse haben etwa 12% weniger Leben und etwas weniger Schaden, bleiben aber hart','Urgolem (Welle 15): weniger Leben, schwächere Brut','Welle 12: ein Wolkenschütze weniger']],
 ['2.029 · Himmel und Bosse',['Flieger: Sturmfalke, Wolkenschütze und Donneradler schweben mit Schatten über dem Boden. Nur Fernkämpfer (Bogenschützen, Magier, Heiler mit Fernangriff) und der König können sie treffen, Nahkämpfer nicht','Die ersten Flieger kommen in Welle 7 und 12; danach tauchen sie zufällig auf, ab Welle 16 auch der Donneradler','Boss-Fähigkeiten: Bossgolem stampft alle 7 Sekunden und betäubt Einheiten in der Nähe; Urgolem ruft Brut und heilt sich; die Boss-Brüder werden wütender, wenn ein Bruder fällt','In der Wellenvorschau steht jetzt „Flug“ und die Boss-Fähigkeit; Einheiten-Infos zeigen, ob sie Flieger treffen']],
 ['2.028 · Mitwachsende Creeps',['Die Creeps passen sich deiner Armee an: Je mehr du in Einheiten investiert hast (verglichen mit einer normalen Armee dieser Welle), desto mehr Leben und etwas mehr Schaden haben sie, bis zu +80%','Gilt auf Normal und Schwer, auf Leicht nicht; auch die Creeps der KI wachsen mit','Die KI investiert ab Welle 5 überschüssiges Gold zusätzlich in Gold- und Holzminen und hat dadurch später mehr Mittel']],
 ['2.027 · Zwei gegen Zwei (Alpha)',['Neuer Modus im Hauptmenü: 2 gegen 2 mit KI-Partner. Du und ein KI-Partner gegen zwei KIs','Jedes Team hat eine breite Bahn mit zwei Bauplätzen (links du, rechts dein Partner), jeder mit eigenem Gold, Holz, Arbeitern und Hauptgebäude','Unten laufen beide Wege zu einem gemeinsamen Laufweg zusammen, ein gemeinsamer König pro Team. Eure Armeen helfen sich gegenseitig','Mit dem Knopf „Gegner-Team ansehen“ wechselst du auf die Bahn des gegnerischen Teams','Die KI ist härter: stärkere Wellen ab der Mitte und schlankere Wirtschaft, dadurch bessere Armeen']],
 ['2.026 · Zähere Creeps',['Gegner haben mehr Leben: Leicht +10%, Normal +25%, Schwer +30% (alle Wellen, auch Bosse und Endlos)','Schaden der Gegner und alles andere bleibt gleich']],
 ['2.025 · Kein Wegspringen',['Heiler und Unterstützer springen nicht mehr bei wenig Leben weg','Deine Einheiten bleiben vorne an der Front stehen und fangen Gegner ab, statt sofort zum König zurückzukehren','Erst wenn der König angegriffen wird, werden alle Einheiten zu ihm teleportiert; Heiler und Unterstützer kommen mit der Armee mit']],
 ['2.024 · Söldner-Beute',['Söldner, die den König erreichen und ihn treffen, bringen dem Sender pro Treffer 1 Gold und kosten den Gegner 1 Gold','Das Einkommen pro Runde steht jetzt immer im Wellenband: deins und das des Gegners, getrennt nach Basis und Söldnern','Am Wellenende steht, wie viel Beute durch Söldner entstanden ist','Söldner-Infos und Lexikon erklären die neue Regel']],
 ['2.023 · Eigene Wege',['Jedes Volk hat eine eigene Besonderheit: Natur verwurzelt Gegner (jeder 5. Treffer), Elementar lässt Gegner explodieren, Mechanisch gewinnt Schaden durch Zielerfassung, Schatten weicht Treffern aus, Bestien geraten in Blutrausch, wenn ein Rudelmitglied fällt','Neue Einheiten-Eigenschaften: Dornenrinde, Brandwunde, Schildgenerator, Durchschlag, Henker, Fluch-Panzer, kritische Treffer, Markierung und Wut','Alle Zweige ab Stufe 3 sind jetzt pro Volk und Einheit eigen: Dornen, Brandwunde, Ketten, Kritische Treffer, Schilde, Ausweichen und mehr','Im Lexikon steht bei jeder Einheit, was ihre beiden Zweige können']],
 ['2.022 · Spielende wählen',['Vor dem Start wählst du: Bis Welle 15 (wie vorher) oder Endlos (danach geht es immer weiter)','Die Auswahl gibt es auch im Duell, der Gastgeber entscheidet']],
 ['2.021 · Endlos',['Nach Welle 15 geht es jetzt endlos weiter, mit Bauphasen wie bisher: Welle 16, 17, 18 …','Nach Welle 15 kommen weniger, aber deutlich stärkere Gegner; alle 5 Wellen ein Boss','Drei neue Gegner ab Welle 16: Schattenjäger, Steinkoloss und Seuchenkriecher','Am Ende siehst du, bis zu welcher Welle du durchgehalten hast']],
 ['2.020 · Feinschliff',['Heiler und Unterstützer laufen jetzt schneller mit der Armee und rücken dichter heran','Weniger Gegner laufen an der Armee vorbei bis zum König','Flüssigeres Spiel im späten Spiel und im Endlos-Modus','Mittlere Wellen sind härter, Arbeiter-Tempo etwas niedriger','Im Duell kann der Gastgeber die Schwierigkeit wählen (Standard: Schwer)','Die Wellenvorschau überdeckt im Kampf nichts mehr']],
 ['2.019 · Duell ohne App',['Es gibt jetzt eine eigenständige Webversion des Duells (direkte Verbindung per WebRTC), die ohne Konto und ohne App im Browser läuft, sobald sie auf einer normalen Webadresse liegt','Bessere Fehlermeldungen im Freund-Raum']],
 ['2.018 · Duell',['Echtes 1 gegen 1 gegen deinen Freund: Raum erstellen, beitreten, Volk wählen, Gastgeber startet. Beide bauen gleichzeitig, Kampf startet, wenn beide bereit sind oder die Zeit abläuft','Der Gastgeber rechnet das Spiel, der Gast sieht es live und schickt seine Aktionen','Gold- und Holz-Anzeige im Spawn-Bereich ist größer und besser lesbar']],
 ['2.017 · Verbindung Neu',['Der Freund-Test nutzt jetzt die eingebaute Raum-Funktion der Claude-Seite statt eines externen Dienstes: Code erscheint sofort, Freund tritt mit Code oder QR-Code bei und sieht Antwortzeit','Beide Spieler müssen in der Claude-App eingeloggt sein und Zugriff auf die Seite haben']],
 ['2.016 · Ordnung im Lexikon',['Das Lexikon hat jetzt Reiter: Regeln, Völker (mit Auswahl pro Volk), Creeps, Bosse, Söldner und Tipps. Creeps und Söldner zeigen auch Reichweite, Beute und Rendite','Aufgeräumte Befehlskarte: oben deine 6 Einheiten (Q W E R, A S), darunter die Gebäude Haupt, Kaserne, König (D F Z) farblich abgesetzt, dann Menü, Stand und Kampf','Neue Tasten: Haupt = D, Kaserne = F, König = Z, Menü = X, Stand = C, Kampf = V']],
 ['2.015 · Tabelle im Blick',['Neue Mini-Tabelle über dem Spielfeld, immer sichtbar: Kills, Leaks, Einkommen, Arbeiter (Gold/Holz) und Armeewert von dir und der KI','Antippen klappt die Tabelle ein, ein zweites Antippen klappt sie wieder aus (wird gemerkt)']],
 ['2.014 · Gedränge & Lexikon',['Einheiten und Gegner stoßen sich jetzt sanft voneinander ab und stapeln sich nicht mehr auf einem Punkt','Kein Teleport mehr mitten im Kampf: Droht dem König Gefahr, rennen deine Einheiten schnell zu ihm. Danach bleiben sie dort und laufen nicht mehr sinnlos zurück nach oben','Elementar, Schatten und Bestien haben ebenfalls zwei neue Einheiten: Glutbeschwörer und Aschegeist, Seelenbrenner und Phantomklinge, Schamane und Wildeber','Das Lexikon ist massiv gewachsen: Spielregeln, alle Völker mit Fähigkeiten, alle Einheiten mit genauen Werten und Reichweiten, der Bestien-Rudelbonus und mehrere freche Sprüche pro Gegner und Boss','Bosse und Gegner rufen beim Wellenstart Sprüche; die Wellen-Countdown-Zahl liegt jetzt weiter unten und überdeckt die Wellenvorschau nicht mehr']],
 ['2.013 · Magier & Spezialisten',['Natur und Mechanisch haben je zwei neue Einheiten: Mondweber (Flächenzauber) und Rankenwürger (bremst im Nahkampf) für Natur, Teslaspule (Magie-Blitz) und Nadler (sehr schnelle Stiche) für Mechanisch. Sie liegen auf D und Z der Befehlskarte','Die KI bekommt auf Normal 250 Startgold (Schwer 270) und investiert in den Wellen 1–8 konsequenter in Gold- und Holzarbeiter, damit sie im Midgame mithält','Die anderen drei Völker bekommen ihre neuen Einheiten nach deinem Test']],
 ['2.012 · Ruhiges Feld',['Verkaufen ist aus der Befehlskarte raus und liegt wieder im Einheiten-Menü (Taste Z), also weit weg vom Upgrade-Knopf','Kein Bildschirmwackeln mehr bei Königstreffern','Sound überarbeitet: weichere Einsätze ohne Knacken, Begrenzer gegen Übersteuern, weniger gleichzeitige Töne und ein sanfterer Treffer-Sound']],
 ['2.011 · Wucht & Härte',['Treffer-Effekte: Aufblitzen und Funken bei Schaden, Schadenszahlen, Todes-Ringe, Wackeln beim Königstreffer und ein knackiger Treffer-Sound','Normal ist deutlich härter: Gegner haben 15 % mehr Leben (Schwer 35 %), dazu etwas mehr Schaden','Das Einheiten-Menü hat keinen Verkaufen-Knopf mehr, verkauft wird über den Verkaufen-Modus (Z)']],
 ['2.010 · Taktischer Start',['Im Einheiten-Menü liegt Verkaufen jetzt fest auf Z, weit weg vom Upgrade-Knopf: kein versehentliches Verkaufen mehr beim schnellen Tippen','Startgold nach Schwierigkeit: Leicht 200, Normal 170, Schwer 140','Die KI auf Normal investiert öfter in Upgrades, spart Mythium kürzer und schickt dadurch konstanter Söldner']],
 ['2.009 · Heiler marschieren mit',['Heiler und Unterstützer laufen jetzt mit der Armee: Sie folgen deinen Kämpfern, bleiben knapp dahinter und heilen oder buffen aktiv','Mechanisch etwas günstiger (Flammer, Blitzwerfer)']],
 ['2.008 · Marsch nach oben & Feinschliff',['Einheiten marschieren zu Beginn des Kampfs aktiv nach oben, kämpfen unterwegs und springen oben angekommen zum König','Verkaufen liegt auf Z, die Kaserne auf S','Kaserne und Hauptgebäude sind auch im Kampf bedienbar (Söldner kommen in der nächsten Welle, Arbeiter sofort)','Das Baufeld hat 6 statt 8 Reihen, die Karte ist kürzer','KI auf Normal: schickt Söldner erst ab Welle 3, wählt sie vorsichtiger, investiert ab 12 Einheiten nur noch in Upgrades','Stufe 5 etwas schwächer (+50% statt +60% pro Stufe), Flächenschaden etwas schwächer','Weniger Gold: Startgold 170, Grundeinkommen 28 pro Welle','Balance: Natur, Mechanisch und Elementar angepasst']],
 ['2.007 · Grünes Holz & saubere Karte',['Holz ist jetzt grün (Gold gelb, Söldner-Gegner bleiben lila)','Gold, Holz und Einheitenzahl stehen oben im Spawn-Bereich deiner Karte, die obere Leiste ist weg','Stand und Menü sind in der Befehlskarte (Tasten C und F)','Der König erkennt Gegner früher, der Hetzer kommt nicht mehr ungekontert durch: Einheiten springen bei schnellen Gegnern früher zum König','Schlauere KI: spart Holz nicht mehr starr und wählt Söldner passend zu deinen Rüstungstypen','Balance: Reichweiten angeglichen (Fernkämpfer ca. 90, Heiler ca. 75-80), Elementar und Mechanisch gestärkt']],
 ['2.006 · Vorschau & Freund-Test',['Aufgeräumte Kopfleiste: die Einkünfte-Box ist weg','Die nächste Welle steht direkt im Spawn-Bereich der Karte (Gegner, Anzahl, Rüstung, Boss-Hinweis)','Upgrade-Vorschau: Erst tippen zeigt die neuen Werte (auch beim Zweig bei Stufe 3), ein zweiter Tipp kauft','Hauptmenü: 1 gegen 1 mit Freund als Verbindungstest (Raumcode und QR-Code). Das Spiel selbst läuft noch nicht darüber']],
 ['2.005 · Urgolem & Mischwellen',['Welle 15 hat einen eigenen Boss: den Urgolem, mit Begleitern (Schwarm und Moorgeister)','Mischwellen: Ab Welle 3 kommen oft 2 Gegnertypen zusammen, ab Welle 7 teils 3. Die Wellenleiste und die Wellenliste zeigen alle Typen und Rüstungen vorab','Heiler-Fluchtsprung: Fällt ein Heiler unter 40% Leben, springt er einmal pro Welle zum König','Neuer Lexikon-Eintrag für den Urgolem']],
 ['2.004 · Strenger Fehlklick-Schutz',['Tippst du eine gebaute Einheit an, wird die Bau-Auswahl aufgehoben: danach kann nichts mehr aus Versehen daneben gebaut werden','Ist ein Menü offen (Einheit, Haupt, Kaserne, König), schließt der erste Tipp aufs leere Feld nur das Menü und baut nichts','Tippen außerhalb deines Baufelds (Spawn, Laufbereich, Gegner-Insel) hebt die Auswahl auf']],
 ['2.003 · Endlos & Fehlklick-Schutz',['Fehlklick-Schutz: Einheit in der Leiste nochmal antippen hebt die Auswahl auf, ohne Auswahl baut ein Tippen aufs Feld nichts','Ein Klick auf eine gebaute Einheit öffnet weiterhin ihr Menü (Verbessern, Verkaufen)','Arbeiter einzeln kaufen: bis zu 5 Goldarbeiter und 5 Holzfäller, der Einstieg ist billiger, weitere kosten mehr','Umschichten entfällt, das Lauftempo-Upgrade gilt für alle Arbeiter zugleich','Endlos-Modus: Nach Welle 15 folgt Welle 16 als letzte Bauphase, danach kommen alle 3 Sekunden neue Gegner, bis ein König fällt']],
 ['2.002 · Änderungsliste',['Im Hauptmenü steht bei Neuigkeiten jetzt jede Version mit kurzen Texten, was neu ist','Nach einem Update zeigt das Hauptmenü einmal eine Karte "Neu in dieser Version"']],
 ['2.001 · Arbeiter & Zweige',['Arbeiter laufen sichtbar zwischen Hauptgebäude und Mine, bis zu 5, mit Tempo-Upgrade','Einheiten bekommen ab Stufe 3 zwei Zweige (Spritze oder Flächenschaden)','Großer Countdown in der 45-Sekunden-Bauphase','Gegner werden nach 30/35/40 Sekunden wütender','Zufällige Wellenreihenfolge und zwei neue Gegner','Stein-Schere-Papier: Stich, Wucht, Magie gegen Leicht, Schwer, Arkan','Neues Hauptmenü mit Statistik']],
 ['2.000 · Grundlage',['Neue Karte, Befehlskarte unten rechts, Lexikon, Musik und Effekte','5 Völker, Söldner, König-Ausbau, Boss-Wellen']]
];
let homeView='menu';
let mpOff=[],mpCode='',mpRole='',mpPing=0,mpFac=null,mpDiff='hard',mpMode='w15',mpBuf={},mpApplied=0,mpLastSnap=0,mpSnapId=0,mpSent=[];
function OPP(){return mpGame?'Freund':'KI';}
const MP_URL=location.href.split('#')[0].split('?')[0];
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Konnte '+src+' nicht laden'));document.head.appendChild(s);});}
function mpSay(t,cls){const e=$('mpstat');if(e){e.textContent=t;e.className='mpstat '+(cls||'');}}
function mpClose(){mpOff.forEach(f=>{try{f();}catch(_){}});mpOff=[];try{if(mpRoom)mpRoom.leave();}catch(_){}mpRoom=null;mpCode='';mpRole='';}

const _pl=place,_se=sell,_up=upgrade,_bm=buyMine,_bw=buyWSpeed,_ku=kingUp,_sm=sendMerc;
function gw(name,f){return (G,l,...a)=>{const r=f(G,l,...a);if(mpGame==='guest'&&r===true&&mpRoom)mpRoom.emit('cmd',{c:name,a}).catch(()=>{});return r;};}
place=gw('place',_pl);sell=gw('sell',_se);upgrade=gw('upgrade',_up);buyMine=gw('buyMine',_bm);buyWSpeed=gw('buyWSpeed',_bw);kingUp=gw('kingUp',_ku);sendMerc=gw('sendMerc',_sm);
function packEnts(a){const ks=[],seen={};a.forEach(o=>{for(const k in o){if(k==='eff'||seen[k])continue;seen[k]=1;ks.push(k);}});return{k:ks,r:a.map(o=>ks.map(k=>o[k]===undefined?null:o[k]))};}
function unpackEnts(old,pk){const m=new Map();(old||[]).forEach(o=>m.set(o.id,o));const ii=pk.k.indexOf('id'),xi=pk.k.indexOf('x'),yi=pk.k.indexOf('y');
  return pk.r.map(row=>{let o=m.get(row[ii]);const fresh=!o;if(fresh)o={};
    pk.k.forEach((k,i)=>{if(k==='x'||k==='y')return;const v=row[i];if(v===null)delete o[k];else o[k]=v;});
    if(fresh){o.x=row[xi];o.y=row[yi];}o.nx=row[xi];o.ny=row[yi];return o;});}
function mpPack(){
  const R=(k,v)=>typeof v==='number'?Math.round(v*10)/10:v,gs={},SKIP={lanes:1,order:1,history:1,saved:1,endMsg:1,mp:1,rdMine:1};
  for(const k in g){const v=g[k];if(SKIP[k])continue;if(v===null||typeof v!=='object')gs[k]=v;}
  const L=g.lanes.map(l=>{const o={};for(const k in l){if(k==='units'||k==='enemies')continue;o[k]=l[k];}o.u=packEnts(l.units);o.e=packEnts(l.enemies);return o;});
  return JSON.stringify({g:gs,L,rd:mpReady},R);
}
function mpHostTick(t){
  if(!mpRoom)return;const iv=g.phase==='fight'?150:400;if(t-mpLastSnap<iv)return;
  const now=performance.now();mpSent=mpSent.filter(x=>now-x<1000);if(mpSent.length>26)return;
  mpLastSnap=t;const s=mpPack(),id=++mpSnapId,N=Math.ceil(s.length/3000);
  for(let i=0;i<N;i++){mpSent.push(now);mpRoom.emit('snap',{s:id,i,n:N,d:s.slice(i*3000,(i+1)*3000)}).catch(()=>{});}
  if(N>3)mpLastSnap=t+N*25;
}
function mpApply(data){
  const pp=g.phase;
  for(const k in data.g)g[k]=data.g[k];
  if(g.winner===0)g.winner=1;else if(g.winner===1)g.winner=0;
  [1,0].forEach((hi,li)=>{const ln=g.lanes[li],src=data.L[hi],ou=ln.units,oe=ln.enemies;for(const k in src){if(k==='u'||k==='e')continue;ln[k]=src[k];}ln.units=unpackEnts(ou,src.u);ln.enemies=unpackEnts(oe,src.e);});
  g.rdMine=!!(data.rd&&data.rd[1]);
  if(pp!==g.phase){
    if(g.phase==='fight'){const wi=waveInfo(g.wave);Snd.sfx(wi&&wi.boss?'boss':'wave');page='build';openPanel=null;inspect=null;closeModals();acc=0;prevKills=g.lanes[0].kills+g.lanes[1].kills;prevHp=[g.lanes[0].kingHp,g.lanes[1].kingHp];
      if(wi&&QUOTES[wi.kind]&&(wi.boss||Math.random()<.5))msg(wi.name+': „'+quoteOf(wi.kind)+'“',false,wi.boss?4500:3000);}
    else if(g.phase==='build'&&pp==='fight'){msg('Welle '+g.wave+' überstanden. Kopfgeld: +'+g.lanes[0].kg+' Gold.'+(g.lanes[0].loot?' Beute durch Söldner: +'+g.lanes[0].loot+'.':'')+(g.lanes[0].lost?' Verloren an Söldner: −'+g.lanes[0].lost+'.':''));Snd.sfx('waveWin');}
    else if(g.phase==='over')showOver();
  }
}
function mpSmooth(dt){const d=1-Math.exp(-dt*14);g.lanes.forEach(l=>[l.units,l.enemies].forEach(a=>a.forEach(o=>{if(o.nx===undefined)return;if(Math.abs(o.nx-o.x)>40||Math.abs(o.ny-o.y)>40){o.x=o.nx;o.y=o.ny;}else{o.x+=(o.nx-o.x)*d;o.y+=(o.ny-o.y)*d;}})));}
function mpHostCmd(m){
  if(m.isMe||mpGame!=='host'||!g)return;const d=m.data||{},a=d.a||[];
  switch(d.c){
    case 'place':_pl(g,1,a[0]|0,a[1]|0,String(a[2]));break;
    case 'sell':_se(g,1,a[0]|0,a[1]|0);break;
    case 'upgrade':_up(g,1,a[0]|0,a[1]|0,a[2]);break;
    case 'buyMine':_bm(g,1,a[0]);break;
    case 'buyWSpeed':_bw(g,1);break;
    case 'kingUp':_ku(g,1,a[0]);break;
    case 'sendMerc':_sm(g,1,a[0]);break;
    case 'ready':mpReady[1]=true;if(g.phase==='build'){if(mpReady[0])goFight(true);else msg('Dein Gegner ist bereit.');}break;
  }
}

  mpGame=role;pf=myFac;af=oppFac;speed=1;
  $('home').hidden=true;$('pick').hidden=true;$('play').hidden=false;$('over').hidden=true;

}

function renderMpGame(show,host){
  const bx=$('mpgame');if(!bx)return;bx.hidden=!show;if(!show)return;
  const o=mpRoom&&mpRoom.peers().find(p=>!p.isMe&&p.kind==='viewer'),of=o&&o.presence&&o.presence.fac;
  bx.innerHTML='<div class="dxh">Dein Volk</div><div class="chips">'+Object.keys(FACTIONS).map(k=>'<button class="chip" data-mpfac="'+k+'" aria-pressed="'+(mpFac===k)+'">'+FACTIONS[k].name+'</button>').join('')+'</div><div class="dxh">Schwierigkeit der Wellen</div><div class="chips">'+[['easy','Leicht'],['normal','Normal'],['hard','Schwer']].map(a=>'<button class="chip" data-mpdiff="'+a[0]+'" aria-pressed="'+(mpDiff===a[0])+'"'+(host?'':' disabled')+'>'+a[1]+'</button>').join('')+'</div><div class="dxh">Spielende</div><div class="chips">'+[['w15','Bis Welle 15'],['endless','Endlos']].map(a=>'<button class="chip" data-mpmode="'+a[0]+'" aria-pressed="'+(mpMode===a[0])+'"'+(host?'':' disabled')+'>'+a[1]+'</button>').join('')+'</div>'

  }
}
